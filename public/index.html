<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Citas del taller</title>
  <style>
    :root { --bg:#f4f5f7; --card:#fff; --ink:#1d2330; --muted:#6b7280; --brand:#1f6feb; --me:#1f6feb; --bot:#eef1f5; --line:#e3e6eb; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#111418; --card:#1a1f26; --ink:#e7eaee; --muted:#9aa3ae; --brand:#4c8dff; --me:#2f6fe0; --bot:#252c35; --line:#2c333d; }
    }
    * { box-sizing: border-box; }
    body { margin:0; font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); display:flex; justify-content:center; }
    .app { width:100%; max-width:560px; height:100dvh; display:flex; flex-direction:column; background:var(--card); border-inline:1px solid var(--line); }
    header { padding:14px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:8px; }
    header h1 { font-size:17px; margin:0; }
    .badge { font-size:12px; padding:3px 8px; border-radius:999px; background:var(--bot); color:var(--muted); white-space:nowrap; }
    #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
    .msg { max-width:85%; padding:9px 13px; border-radius:16px; white-space:pre-wrap; word-wrap:break-word; }
    .bot { background:var(--bot); align-self:flex-start; border-bottom-left-radius:4px; }
    .me { background:var(--me); color:#fff; align-self:flex-end; border-bottom-right-radius:4px; }
    .tools { align-self:flex-start; font-size:12px; color:var(--muted); font-family:ui-monospace,Menlo,monospace; }
    .chips { display:flex; gap:6px; flex-wrap:wrap; padding:0 16px 10px; }
    .chips button { border:1px solid var(--line); background:transparent; color:var(--ink); border-radius:999px; padding:5px 11px; font-size:13px; cursor:pointer; }
    form { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); }
    input { flex:1; padding:11px 13px; border-radius:12px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font-size:16px; }
    form button { padding:0 16px; border:0; border-radius:12px; background:var(--brand); color:#fff; font-weight:600; cursor:pointer; }
    form button:disabled { opacity:.5; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1 id="title">Asistente de citas</h1>
      <span class="badge" id="mode">…</span>
    </header>
    <div id="log"></div>
    <div class="chips">
      <button data-q="¿Qué servicios tenéis?">Servicios</button>
      <button data-q="¿Cuánto cuesta un cambio de aceite?">Precio aceite</button>
      <button data-q="Quiero cita para revisión mañana">Cita mañana</button>
      <button data-q="Reiniciar" data-reset>Nueva conversación</button>
    </div>
    <form id="form">
      <input id="input" autocomplete="off" placeholder="Escribe tu mensaje…" />
      <button id="send">Enviar</button>
    </form>
  </div>
<script>
  const log = document.getElementById('log');
  const input = document.getElementById('input');
  const send = document.getElementById('send');
  let sessionId = crypto.randomUUID();

  function add(text, cls) {
    const div = document.createElement('div');
    div.className = 'msg ' + cls;
    div.textContent = text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  }
  function addTools(calls) {
    if (!calls || !calls.length) return;
    const div = document.createElement('div');
    div.className = 'tools';
    div.textContent = '🔧 ' + calls.map(c => c.name).join(' → ');
    log.appendChild(div);
  }

  async function ask(text) {
    add(text, 'me');
    send.disabled = true;
    try {
      const r = await fetch('/api/chat', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ sessionId, message:text }) });
      const data = await r.json();
      addTools(data.toolCalls);
      add(data.reply || data.error || 'Error', 'bot');
    } catch { add('No hay conexión con el servidor.', 'bot'); }
    send.disabled = false;
    input.focus();
  }

  document.getElementById('form').addEventListener('submit', e => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    ask(text);
  });
  document.querySelectorAll('.chips button').forEach(b => b.addEventListener('click', async () => {
    if (b.hasAttribute('data-reset')) {
      await fetch('/api/chat/reset', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ sessionId }) });
      sessionId = crypto.randomUUID();
      log.innerHTML = '';
      greet();
      return;
    }
    ask(b.dataset.q);
  }));

  function greet() { add('¡Hola! Puedo darte precios, ver huecos libres y reservar tu cita. ¿Qué necesita tu coche?', 'bot'); }

  fetch('/api/services').then(r => r.json()).then(d => { document.getElementById('title').textContent = d.workshop.name; }).catch(() => {});
  fetch('/api/health').then(r => r.json()).then(d => {
    document.getElementById('mode').textContent = d.mode === 'claude' ? 'IA: Claude' : 'Modo demo';
  }).catch(() => {});
  greet();
</script>
</body>
</html>
